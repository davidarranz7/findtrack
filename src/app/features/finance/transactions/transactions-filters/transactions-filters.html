<section class="transactions-filters" aria-label="Filtros de transacciones">
  <div class="filters-primary-row">
    <div class="transaction-search">
      <i class="bi bi-search transaction-search-icon" aria-hidden="true"></i>

      <input
        #searchInput
        type="search"
        class="transaction-search-input"
        placeholder="Buscar por concepto, notas o categoría..."
        [value]="filters.searchTerm()"
        (input)="filters.updateSearchTerm(searchInput.value)"
      />
    </div>

    <div class="month-filter">
      <i class="bi bi-calendar3" aria-hidden="true"></i>

      <input
        #monthInput
        type="month"
        class="month-filter-input"
        [value]="filters.selectedMonth()"
        (change)="filters.selectMonth(monthInput.value)"
      />
    </div>

    <div class="transaction-type-filter" role="group" aria-label="Filtrar por tipo">
      <button
        type="button"
        class="transaction-type-filter-button"
        [class.active]="filters.selectedType() === 'all'"
        (click)="filters.selectType('all')"
      >
        Todos
        <span class="filter-count">
          {{ summary.totalTransactionsInSelectedMonth() }}
        </span>
      </button>

      <button
        type="button"
        class="transaction-type-filter-button"
        [class.active]="filters.selectedType() === 'income'"
        (click)="filters.selectType('income')"
      >
        Ingresos
        <span class="filter-count">
          {{ summary.incomeCount() }}
        </span>
      </button>

      <button
        type="button"
        class="transaction-type-filter-button"
        [class.active]="filters.selectedType() === 'expense'"
        (click)="filters.selectType('expense')"
      >
        Gastos
        <span class="filter-count">
          {{ summary.expenseCount() }}
        </span>
      </button>
    </div>
  </div>

  <div class="filters-secondary-row">
    <div class="filter-select-wrapper">
      <i class="bi bi-tag" aria-hidden="true"></i>

      <select
        #categorySelect
        class="filter-select"
        [value]="filters.selectedCategoryId()"
        [disabled]="state.isLoadingCategories()"
        (change)="filters.selectCategory(categorySelect.value)"
      >
        <option value="all">Todas las categorías</option>

        @for (category of state.categories(); track category.id) {
          <option [value]="category.id">
            {{ category.name }}
          </option>
        }
      </select>
    </div>

    <div class="filter-select-wrapper">
      <i class="bi bi-credit-card" aria-hidden="true"></i>

      <select
        #paymentSelect
        class="filter-select"
        [value]="filters.selectedPaymentMethod()"
        (change)="filters.selectPaymentMethod(paymentSelect.value)"
      >
        <option value="all">Todos los métodos</option>
        <option value="cash">Efectivo</option>
        <option value="card">Tarjeta</option>
        <option value="bankTransfer">Transferencia</option>
      </select>
    </div>

    <div class="filters-result">
      <span>
        {{ filters.filteredTransactions().length }}
        @if (filters.filteredTransactions().length === 1) {
          resultado
        } @else {
          resultados
        }
      </span>
    </div>

    <button
      type="button"
      class="clear-filters-button"
      [disabled]="!filters.hasActiveFilters()"
      (click)="filters.clearFilters()"
    >
      <i class="bi bi-x-circle" aria-hidden="true"></i>
      Limpiar filtros
    </button>
  </div>

  @if (state.categoryLoadError()) {
    <div class="filters-error" role="alert">
      <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
      {{ state.categoryLoadError() }}
    </div>
  }
</section>

<section class="settings-page">
  <app-page-header
    eyebrow="CONFIGURACIÓN DE CUENTA"
    title="Configuración"
    description="Gestiona tu cuenta, preferencias y alertas."
  >
    <div class="settings-header-actions" pageHeaderActions>
      <button
        type="button"
        class="btn btn-outline-secondary"
        [disabled]="
          !hasUnsavedChanges() || isSavingChanges() || preferencesState.isLoadingPreferences()
        "
        (click)="discardChanges()"
      >
        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
        Descartar
      </button>

      <button
        type="button"
        class="btn btn-primary"
        [disabled]="
          !hasUnsavedChanges() ||
          profile.form.invalid ||
          preferencesState.form.invalid ||
          profile.isCheckingAvailability() ||
          isSavingChanges() ||
          preferencesState.isLoadingPreferences()
        "
        (click)="saveChanges()"
      >
        @if (isSavingChanges()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          Guardando...
        } @else {
          <i class="bi bi-floppy" aria-hidden="true"></i>
          Guardar cambios
        }
      </button>
    </div>
  </app-page-header>

  @if (preferencesState.isLoadingPreferences()) {
    <section class="settings-state" aria-live="polite">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden"> Cargando configuración... </span>
      </div>

      <div>
        <strong>Cargando configuración</strong>
        <p class="mb-0">Estamos preparando tus preferencias.</p>
      </div>
    </section>
  } @else if (preferencesState.preferencesLoadError()) {
    <div class="alert alert-danger settings-error" role="alert">
      <i class="bi bi-exclamation-circle" aria-hidden="true"></i>

      <div>
        <strong>No hemos podido cargar la configuración.</strong>
        <p class="mb-0">
          {{ preferencesState.preferencesLoadError() }}
        </p>
      </div>
    </div>
  } @else {
    <app-settings-profile />

    <div class="settings-middle-grid">
      <app-settings-preferences />
      <app-settings-alerts />
    </div>
  }
</section>

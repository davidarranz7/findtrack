<section class="budgets-page">
  <app-page-header
    class="budgets-header"
    eyebrow="PLANIFICACIÓN FINANCIERA"
    title="Presupuestos"
    description="Define límites mensuales y controla cuánto estás gastando en cada categoría."
  >
    <div class="budgets-header-actions" pageHeaderActions>
      <div class="budget-month-selector">
        <i class="bi bi-calendar3" aria-hidden="true"></i>

        <input
          #monthInput
          type="month"
          class="budget-month-input"
          [value]="state.selectedMonth()"
          (change)="selectMonth(monthInput.value)"
        />
      </div>

      <button
        type="button"
        class="btn btn-primary"
        [disabled]="state.isLoading() || state.loadError() !== null || !state.canCreateBudget()"
        (click)="openCreateBudgetForm()"
      >
        <i class="bi bi-plus-circle me-2" aria-hidden="true"></i>
        Nuevo presupuesto
      </button>
    </div>
  </app-page-header>

  @if (state.loadError()) {
    <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
      <i class="bi bi-exclamation-circle" aria-hidden="true"></i>

      <span>{{ state.loadError() }}</span>
    </div>
  }

  <app-budgets-summary />

  <app-budgets-list
    [isDeletingBudget]="isDeletingBudget()"
    (createRequested)="openCreateBudgetForm()"
    (editRequested)="openEditBudgetForm($event)"
    (deleteRequested)="openDeleteBudgetDialog($event)"
  />
</section>

@if (isBudgetFormOpen()) {
  <div
    class="budget-modal-backdrop"
    role="presentation"
    (click)="$event.target === $event.currentTarget && closeBudgetForm()"
  >
    <section
      class="budget-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="budget-modal-title"
    >
      <app-budget-form
        [budget]="selectedBudget()"
        [categories]="state.categories()"
        [selectedMonth]="state.selectedMonth()"
        [unavailableCategoryIds]="state.unavailableCategoryIds()"
        [isSaving]="isSavingBudget()"
        [errorMessage]="budgetFormError()"
        (submitted)="saveBudget($event)"
        (cancelled)="closeBudgetForm()"
      />
    </section>
  </div>
}

@if (budgetToDelete()) {
  <app-confirm-dialog
    title="Eliminar presupuesto"
    [message]="
      '¿Quieres eliminar el presupuesto de ' +
      budgetToDeleteCategoryName() +
      ' para ' +
      selectedMonthLabel() +
      '?'
    "
    confirmText="Eliminar presupuesto"
    processingText="Eliminando..."
    [isProcessing]="isDeletingBudget()"
    [errorMessage]="budgetDeleteError()"
    (confirmed)="confirmDeleteBudget()"
    (cancelled)="closeDeleteBudgetDialog()"
  >
    <p class="mb-0 text-secondary small">
      Solo se eliminará el presupuesto de este mes. La categoría, tus transacciones y los
      presupuestos de otros meses se conservarán.
    </p>
  </app-confirm-dialog>
}

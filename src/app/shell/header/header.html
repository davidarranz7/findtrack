<header class="app-header bg-white border-bottom">
  <div class="d-flex align-items-center justify-content-between gap-4 h-100 px-4">
    <div class="d-flex align-items-center gap-2 text-nowrap">
      <span class="fw-semibold text-dark"> Finora App </span>

      <i class="bi bi-chevron-right small text-secondary" aria-hidden="true"></i>

      <span class="small text-secondary">
        {{ currentSection() }}
      </span>
    </div>

    <div class="header-actions d-flex align-items-center justify-content-end gap-3 flex-grow-1">
      <div class="header-search input-group input-group-sm">
        <span class="input-group-text bg-white border-end-0">
          <i class="bi bi-search text-secondary" aria-hidden="true"></i>
        </span>

        <input
          type="search"
          class="form-control border-start-0"
          placeholder="Buscar..."
          aria-label="Buscar en Finora"
        />
      </div>

      <div #notificationWrapper class="notification-wrapper">
        <button
          type="button"
          class="btn btn-light header-action-button notification-trigger d-flex align-items-center justify-content-center"
          aria-label="Notificaciones"
          [attr.aria-expanded]="isNotificationPanelOpen()"
          (click)="toggleNotificationPanel()"
        >
          <i class="bi bi-bell" aria-hidden="true"></i>

          @if (unreadNotificationCount() > 0) {
            <span class="notification-badge" aria-label="Notificaciones sin leer">
              {{ unreadNotificationCount() }}
            </span>
          }
        </button>

        @if (isNotificationPanelOpen()) {
          <div class="notification-dropdown">
            <app-notification-panel
              [notifications]="notifications()"
              [isLoading]="isLoadingNotifications()"
              (notificationSelected)="handleNotificationSelected($event)"
              (markAllAsRead)="markAllNotificationsAsRead()"
            />
          </div>
        }
      </div>

      <button
        type="button"
        class="btn btn-light header-action-button d-flex align-items-center justify-content-center"
        aria-label="Configuración de usuario"
        title="Configuración"
        (click)="openSettings()"
      >
        <i class="bi bi-person-circle" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        class="btn btn-light header-action-button d-flex align-items-center justify-content-center"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="logout()"
      >
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>

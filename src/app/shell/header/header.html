<header class="app-header">
  <div class="header-inner d-flex align-items-center justify-content-between h-100">
    <div class="header-breadcrumb d-flex align-items-center gap-2 text-nowrap">
      <span class="fw-semibold"> Finora<span class="header-brand-app"> App</span> </span>

      <i class="bi bi-chevron-right small header-breadcrumb-separator" aria-hidden="true"></i>

      <span class="header-current-section small">
        {{ currentSection() }}
      </span>
    </div>

    <div class="header-actions d-flex align-items-center justify-content-end flex-grow-1">
      <app-header-search (searchOpened)="closeNotifications()" />

      <button
        type="button"
        class="header-action-button"
        [disabled]="isSavingTheme()"
        [attr.aria-busy]="isSavingTheme()"
        [attr.aria-label]="isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
        [attr.title]="isDark() ? 'Modo claro' : 'Modo oscuro'"
        (click)="toggleTheme()"
      >
        <i [class]="isDark() ? 'bi bi-sun' : 'bi bi-moon'" aria-hidden="true"></i>
      </button>

      <app-header-notifications (notificationsOpened)="closeSearch()" />

      <button
        type="button"
        class="header-action-button header-profile-button"
        aria-label="Configuración de usuario"
        title="Configuración"
        (click)="openSettings()"
      >
        <i class="bi bi-person-circle" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        class="header-action-button"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="logout()"
      >
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>
